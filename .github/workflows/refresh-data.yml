name: Refresh country context data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-public-data.mjs'
      - 'scripts/update-subnational-ipc.mjs'
      - 'scripts/update-wfp-chirps.mjs'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: country-context-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HAPI_APP_IDENTIFIER: ${{ secrets.HAPI_APP_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronise with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use proven HAPI v2 endpoints
        run: sed -i 's#https://hapi.humdata.org/api/v1#https://hapi.humdata.org/api/v2#' scripts/update-public-data.mjs
      - name: Refresh country context APIs
        run: node scripts/update-public-data.mjs
      - name: Refresh subnational IPC independently
        run: node scripts/update-subnational-ipc.mjs
      - name: Refresh CHIRPS directly from WFP HDX
        run: node scripts/update-wfp-chirps.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh country context data"
            git push origin main
          fi
